##
## NGINX reverse proxy config for Smart Attendance System
## File: /etc/nginx/sites-available/attendance
## Enable: sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
##

server {
    listen 80;
    server_name your-pi-ip-or-domain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-pi-ip-or-domain.com;

    # SSL — generate with: sudo certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options    nosniff;
    add_header X-Frame-Options           DENY;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # Proxy to FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rate limiting for ESP32 scan endpoint
    location /attendance/scan {
        limit_req zone=esp32_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Rate limit zone (add to /etc/nginx/nginx.conf http block)
# limit_req_zone $binary_remote_addr zone=esp32_limit:10m rate=10r/s;
